name: Hourly Job Scraper

on:
  schedule:
    # Runs at the start of every hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install gspread oauth2client requests beautifulsoup4

      - name: Run Scraper
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scraper.py
